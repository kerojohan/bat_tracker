background:
  sample_frames: 120
  uniform_sampling: true

detection:
  blur_kernel: 9
  threshold_mode: fixed
  diff_threshold: 22
  otsu_offset: 0
  morph_open: 3
  morph_close: 3
  min_area: 20
  max_area: 50000
  max_global_intensity_shift: -1.0
  max_foreground_ratio: 0.04
  max_detections_per_frame: 120
  roi_x_min: -1.0
  roi_x_max: -1.0
  roi_y_min: -1.0
  roi_y_max: 780.0
  temporal_burst_min_detections: 18
  temporal_burst_window_frames: 12
  temporal_burst_trigger_frames: 4
  temporal_burst_cooldown_frames: 20

tracking:
  max_distance: 100.0
  max_missed: 3
  min_track_length: 5
  min_track_displacement: 16.0
  min_track_path_length: 24.0
  min_track_straightness: 0.05

output:
  overlay_line_thickness: 2
  overlay_start_radius: 5
  overlay_alpha: 1.0

  merge_overlap_min_direction_cosine: 0.8
  export_track_candidates: true
valid_region:
  enabled: true
  method: hybrid_deep_layer_profile
  apply_to_detection: false
  hybrid_combine_mode: and
  input_image: ""
  input_mask: ""

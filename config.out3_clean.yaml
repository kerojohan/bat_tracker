background:
  sample_frames: 120
  uniform_sampling: true
  input_image: ""
  context_start_sec: 0.0
  context_duration_sec: -1.0
detection:
  blur_kernel: 9
  threshold_mode: fixed
  diff_threshold: 18
  otsu_offset: 0
  morph_open: 3
  morph_close: 3
  min_area: 12
  max_area: 50000
  max_global_intensity_shift: -1.0
  max_foreground_ratio: 0.04
  max_detections_per_frame: 80
  roi_x_min: -1.0
  roi_x_max: -1.0
  roi_y_min: -1.0
  roi_y_max: -1.0
  temporal_burst_min_detections: 16
  temporal_burst_window_frames: 10
  temporal_burst_trigger_frames: 3
  temporal_burst_cooldown_frames: 24
tracking:
  max_distance: 120.0
  max_missed: 12
  min_track_length: 6
  min_track_duration_sec: 0.1
  min_track_displacement: 20.0
  min_track_path_length: 28.0
  min_track_straightness: 0.08

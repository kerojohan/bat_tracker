  video_filename: flight_trails_overlay.mp4
  history_frames: 12
  max_track_gap_frames: 2
  decay: 0.90
  segment_thickness: 3
  point_radius: 2
  segment_intensity: 1.0
  point_intensity: 1.35
  overlay_alpha: 0.60
  colormap: inferno
  clip_percentile: 99.0
  max_normalization_value: 0.0

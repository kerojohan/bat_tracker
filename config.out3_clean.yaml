background:
  sample_frames: 120
  uniform_sampling: true

detection:
  blur_kernel: 9
  threshold_mode: fixed
  diff_threshold: 12
  otsu_offset: 0
  morph_open: 3
  morph_close: 3
  min_area: 8
  max_area: 50000
  max_global_intensity_shift: -1.0
  max_foreground_ratio: 0.04
  max_detections_per_frame: 80
  roi_x_min: -1.0
  roi_x_max: -1.0
  roi_y_min: -1.0
  roi_y_max: 780.0
  temporal_burst_min_detections: 16
  temporal_burst_window_frames: 10
  temporal_burst_trigger_frames: 3
  temporal_burst_cooldown_frames: 24

tracking:
  max_distance: 120.0
  max_missed: 10
  min_track_length: 6
  min_track_displacement: 20.0
  min_track_path_length: 28.0
  min_track_straightness: 0.08
  min_track_duration_sec: 0.1
  auto_merge_suggested: true
  merge_max_gap_frames: 6
  merge_max_endpoint_distance: 60.0
  merge_overlap_min_common_frames: 3
  merge_overlap_max_mean_distance: 60.0
  merge_overlap_min_direction_cosine: 0.8
  require_start_or_end_in_valid_region: true
  valid_region_gate_dilate_px: 24

valid_region:
  enabled: true
  method: hybrid_deep_layer_profile
  apply_to_detection: false
  hybrid_combine_mode: and
  blur_kernel_size: 151
  depth_percentile: 85.0
  depth_morph_kernel: 9
  depth_min_area_ratio: 0.02
  depth_layer_percentiles: [82, 78, 72, 66]
  depth_layer_dilate_px: [0, 0, 0, 0]
  bottom_contour_snap_enabled: true
  bottom_contour_search_up_px: 20
  bottom_contour_search_down_px: 110
  bottom_contour_smooth_window: 35
  bottom_contour_gradient_quantile: 52.0
  bottom_contour_regularization: 1.25
  bottom_contour_max_step_px: 8
  bottom_contour_downward_bias: 0.20
  bottom_contour_regularization_mix: 0.90
  bottom_contour_deepest_strong_ratio: 0.62
  output_subdir: valid_region
  contour_refine:
    enabled: true            # set true to activate gradient-snap refinement
    method: gradient_snap
    roi_expand_px: 200        # ROI = base mask dilated by this many px (safety limit)
    edge_source: combined     # 'image' | 'depth' | 'combined'
    image_gradient_weight: 1.0
    depth_gradient_weight: 1.0
    smoothness_weight: 0.8    # DP transition penalty (smoothness of snapped edge)
    max_snap_px: 20           # max displacement per edge point (post-expansion fine-tune)
    regularization_weight: 0.6  # mix: 0=pure grad snap, 1=pure smoothed path
    smooth_window: 35         # moving-average window after DP
    intensity_expansion_enabled: true  # expand mask to full dark opening before gradient snap
    expansion_blur_kernel: 21          # sharper depth map for expansion (0=use pipeline blur)
    expansion_intensity_ratio: 0.18    # 0=strict (deepest only), 1=loose (includes rock)
    expansion_close_px: 11             # morphological closing to bridge gaps
    gradient_barrier_enabled: true     # stop expansion at strong gradient edges
    gradient_barrier_percentile: 65.0  # gradient percentile for barrier threshold
    gradient_barrier_close_px: 11      # closing to make barrier continuous

scene_auto_tune:
  enabled: true
  write_profile: true
  use_recommended_values: true
  overrides_allowed: true

output:
  overlay_line_thickness: 2
  overlay_start_radius: 5
  overlay_alpha: 1.0
  overlay_draw_track_labels: true
  overlay_draw_track_labels_at_end: true
  overlay_label_font_scale: 0.5
  overlay_label_thickness: 1
  export_track_clips: false
  track_clips_subdir: track_clips
  track_clips_padding_frames: 5

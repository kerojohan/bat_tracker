background:
  sample_frames: 15
  uniform_sampling: true

detection:
  blur_kernel: 9
  threshold_mode: fixed
  diff_threshold: 25
  otsu_offset: 0
  morph_open: 3
  morph_close: 3
  min_area: 20
  max_area: 50000

tracking:
  max_distance: 100.0
  max_missed: 3
  min_track_length: 5

output:
  overlay_line_thickness: 2
  overlay_start_radius: 5
  overlay_alpha: 1.0

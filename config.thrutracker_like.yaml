background:
  sample_frames: 200
  uniform_sampling: true

detection:
  blur_kernel: 9
  threshold_mode: otsu
  diff_threshold: 25
  otsu_offset: -3
  morph_open: 3
  morph_close: 3
  min_area: 20
  max_area: 50000
  max_global_intensity_shift: 12.0
  max_foreground_ratio: 0.02
  max_detections_per_frame: 25

tracking:
  max_distance: 100.0
  max_missed: 3
  min_track_length: 5
  min_track_displacement: 22.0
  min_track_path_length: 30.0
  min_track_straightness: 0.1

valid_region:
  enabled: true
  input_image: ""
  blur_kernel_size: 151
  profile_smooth_window: 31
  threshold_ratio: 0.45
  safety_margin: 10
  min_region_width_ratio: 0.35
  output_subdir: valid_region

output:
  overlay_line_thickness: 2
  overlay_start_radius: 5
  overlay_alpha: 1.0

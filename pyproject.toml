[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bat_tracker"
version = "0.1.0"
description = "CPU-first bat trajectory extraction from monochrome IR cave videos"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "opencv-python>=4.8",
  "matplotlib>=3.7",
  "PyYAML>=6.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0"
]

[project.scripts]
bat-tracker = "bat_tracker.cli:main"
bat-valid-region = "bat_tracker.valid_region:main"
bat-geometry-review = "bat_tracker.valid_region_geometry_review:main"
bat-mask-geometry-study = "bat_tracker.mask_geometry_study:main"
bat-mask-dilate-sweep = "bat_tracker.mask_dilate_fine_sweep:main"
bat-scene-profile = "bat_tracker.scene_profile:main"
bat-scene-profile-batch = "bat_tracker.scene_profile_batch:main"
bat-pipeline-autotune-eval = "bat_tracker.pipeline_autotune_eval_batch:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["bat_tracker*"]

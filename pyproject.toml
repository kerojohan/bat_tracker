[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bat_tracker"
version = "0.1.0"
description = "Bat trajectory extraction from monochrome IR cave videos"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "opencv-python>=4.8",
  "matplotlib>=3.7",
  "PyYAML>=6.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0"
]
gpu = [
  "cupy-cuda12x>=13.0"
]

[project.scripts]
bat-tracker = "bat_tracker.cli:main"
bat-valid-region = "bat_tracker.valid_region:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["bat_tracker*"]
